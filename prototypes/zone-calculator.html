<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zone Calculator</title>
<style>
:root{
  --bg:#e9eee9; --panel:#ffffff; --ink:#12201a; --muted:#5b6b62; --line:#cdd6cf; --chip:#f1f4f1;
  --flag:#ff5a1f; --flag-ink:#ffffff; --ok:#1f9d55; --warn:#d99a00; --bad:#d63a2f; --blue:#1467e0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1310; --panel:#18211c; --ink:#eaf1ec; --muted:#93a59a; --line:#2b3931; --chip:#212d26;
    --flag:#ff7a45; --flag-ink:#1a0a03; --ok:#3ecf7e; --warn:#f2b632; --bad:#ff6b5e; --blue:#6aa8ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1310; --panel:#18211c; --ink:#eaf1ec; --muted:#93a59a; --line:#2b3931; --chip:#212d26;
  --flag:#ff7a45; --flag-ink:#1a0a03; --ok:#3ecf7e; --warn:#f2b632; --bad:#ff6b5e; --blue:#6aa8ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.35 "Barlow","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 12px 32px}
h1{margin:4px 2px 12px;font-size:22px}
h2{margin:0 0 8px;font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.row+.row{margin-top:8px}
.grow{flex:1;min-width:0}
.lbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.btn{min-height:46px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);font-weight:600}
.btn.p{background:var(--flag);border-color:var(--flag);color:var(--flag-ink)}
.btn.sm{min-height:38px;padding:0 10px;font-size:14px}
.seg{display:flex;gap:6px}
.seg .btn{flex:1;padding:0 6px}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
input.n,select{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);padding:0 10px;width:100%;box-sizing:border-box}
input.n{font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.step{width:46px;flex:none;padding:0;font-size:22px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.warn{color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);font-weight:600;display:flex;align-items:center;gap:6px}
.tab[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:10px;height:10px;border-radius:50%}
.bar{height:18px;border-radius:9px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%}
.big{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.big b{font-size:26px;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block}
.item .nm span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  /* Rain Bird nozzle chart, GPM at 30 PSI (from the contractor's chart). v = value to double-check */
  const GROUPS = [
    ['Fixed arc', [['5F',.41],['5H',.20],['5Q',.10],['8F',1.05],['8H',.52],['8Q',.26],['10F',1.58],['10H',.79],['10Q',.39],['12F',2.60],['12H',1.30],['12Q',.65],['15F',3.70],['15H',1.85],['15Q',.92],['15SQ',3.73]]],
    ['Strips', [['15EST',.61],['15CST',1.21],['15SST',1.21],['15LCS',.49],['15RCS',.49],['9SST',1.73]]],
    ['VAN', [['4VAN 330°',.88],['4VAN 270°',.73],['4VAN 180°',.45],['4VAN 90°',.29],['6VAN 330°',1.20],['6VAN 270°',1.10],['6VAN 180°',.60],['6VAN 90°',.37],['8VAN 330°',1.70],['8VAN 270°',1.55],['8VAN 180°',1.19],['8VAN 90°',.72],['10VAN 330°',2.60],['10VAN 270°',2.10],['10VAN 180°',1.45],['10VAN 90°',.75],['12VAN 330°',2.60],['12VAN 270°',1.95],['12VAN 180°',1.30],['12VAN 90°',.65],['15VAN 330°',3.70],['15VAN 270°',2.78],['15VAN 180°',1.85],['15VAN 90°',.92],['18VAN 330°',5.32],['18VAN 270°',3.99],['18VAN 180°',2.66],['18VAN 90°',1.33]]],
    ['U-Series', [['U-8F',1.05],['U-8H',.52],['U-8Q',.26],['U-10F',1.64],['U-10H',.82],['U-10Q',.41],['U-12F',2.60],['U-12H',1.30,1],['U-12Q',.65],['U-15Q',.92,1],['U-15H',1.85,1],['U-15F',3.70]]]
  ];
  const N = {};
  GROUPS.forEach(g => g[1].forEach(r => N[r[0]] = {g:r[1], v:!!r[2]}));

  const S = {psi:50, line:'34', custom:12, zones:[{items:[]}], sel:0, pick:'10H', qty:1};
  const app = document.getElementById('app');

  const cap = () => S.line === '34' ? 12 : S.line === '1' ? 18 : S.custom;
  const fac = () => Math.sqrt(S.psi/30);
  const gpm = n => N[n].g * fac();
  const used = z => z.items.reduce((a,i) => a + gpm(i.n)*i.q, 0);
  const f2 = x => x.toFixed(2);
  const f1 = x => x.toFixed(1);
  const stat = z => { const p = used(z)/cap(); return p > 1 ? 'var(--bad)' : p > .9 ? 'var(--warn)' : 'var(--ok)'; };

  function render(){
    const z = S.zones[S.sel], u = used(z), c = cap(), pct = Math.min(100, u/c*100), left = c - u;
    const col = stat(z);
    const per = gpm(S.pick), more = Math.max(0, Math.floor((left + 1e-9)/per));

    let h = '<h1>Zone Calculator</h1>';

    // settings
    h += '<div class="card"><h2>System</h2>';
    h += '<div class="lbl">Working pressure (PSI)</div><div class="row">'
      + '<button class="btn step" data-a="psi-">−</button>'
      + '<input class="n grow" id="psi" inputmode="decimal" value="'+S.psi+'" aria-label="Pressure in PSI">'
      + '<button class="btn step" data-a="psi+">+</button></div>';
    h += '<p class="note">Nozzle flow = chart GPM × ' + f2(fac()) + ' (chart is at 30 PSI)</p>';
    if(S.psi < 50) h += '<p class="note warn">Below 50 PSI the 12 / 18 GPM caps may be too high. Do a flow test to be safe.</p>';
    h += '<div class="lbl" style="margin-top:10px">Supply line</div><div class="seg">'
      + ['34|¾″ (12 GPM)','1|1″ (18 GPM)','c|Custom'].map(s => { const [k,t] = s.split('|'); return '<button class="btn" data-a="line" data-k="'+k+'" aria-pressed="'+(S.line===k)+'">'+t+'</button>'; }).join('')
      + '</div>';
    if(S.line === 'c') h += '<div class="row"><div class="grow"><div class="lbl" style="margin-top:8px">Max GPM per zone</div><input class="n" id="custom" inputmode="decimal" value="'+S.custom+'"></div></div>';
    h += '</div>';

    // zones
    h += '<div class="card"><h2>Zones</h2><div class="tabs">';
    S.zones.forEach((zz,i) => { h += '<button class="tab" data-a="zone" data-i="'+i+'" aria-pressed="'+(i===S.sel)+'"><span class="dot" style="background:'+stat(zz)+'"></span>Zone '+(i+1)+'</button>'; });
    h += '<button class="tab" data-a="addzone">+ Zone</button></div>';

    h += '<div class="big"><b style="color:'+col+'">'+f2(u)+' / '+c+' GPM</b><span>'
      + (left >= 0 ? f2(left)+' GPM left' : '<b style="color:var(--bad);font-size:16px">Over by '+f2(-left)+' GPM</b>') + '</span></div>';
    h += '<div class="bar" role="img" aria-label="Zone flow used"><i style="width:'+pct+'%;background:'+col+'"></i></div>';

    z.items.forEach((it,i) => {
      h += '<div class="item"><div class="nm"><b>'+it.n+'</b><span>'+it.q+' × '+f2(gpm(it.n))+' = '+f2(gpm(it.n)*it.q)+' GPM</span></div>'
        + '<button class="btn sm step" data-a="iq-" data-i="'+i+'">−</button><span class="q">'+it.q+'</span>'
        + '<button class="btn sm step" data-a="iq+" data-i="'+i+'">+</button>'
        + '<button class="btn sm step" data-a="del" data-i="'+i+'" aria-label="Remove">✕</button></div>';
    });
    if(!z.items.length) h += '<p class="note">No heads yet. Pick a nozzle below and add it.</p>';

    h += '<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:10px"><div class="lbl">Add heads</div>'
      + '<select id="pick" aria-label="Nozzle">' + GROUPS.map(g => '<optgroup label="'+g[0]+'">' + g[1].map(r => '<option value="'+r[0]+'"'+(r[0]===S.pick?' selected':'')+'>'+r[0]+(r[2]?' (verify)':'')+'</option>').join('') + '</optgroup>').join('') + '</select>'
      + '<p class="note">'+S.pick+': '+f2(N[S.pick].g)+' GPM at 30 PSI → <b>'+f2(per)+' GPM at '+S.psi+' PSI</b>'+(N[S.pick].v?' <span class="warn">(chart value was hard to read)</span>':'')+'. Room for <b>'+more+'</b> more in this zone.</p>'
      + '<div class="row"><button class="btn step" data-a="q-">−</button><span class="q" style="font-size:20px;min-width:36px">'+S.qty+'</span><button class="btn step" data-a="q+">+</button>'
      + '<button class="btn p grow" data-a="add">Add to Zone '+(S.sel+1)+'</button></div></div>';
    if(S.zones.length > 1) h += '<div class="row"><button class="btn sm grow" data-a="delzone">Remove Zone '+(S.sel+1)+'</button></div>';
    h += '</div>';

    // summary
    const tot = {}; let heads = 0;
    S.zones.forEach(zz => zz.items.forEach(i => { tot[i.n] = (tot[i.n]||0) + i.q; heads += i.q; }));
    h += '<div class="card"><h2>Parts so far</h2>';
    if(heads){
      h += '<table><tr><th>Nozzle</th><th class="r">Qty</th></tr>' + Object.keys(tot).map(k => '<tr><td>'+k+'</td><td class="r">'+tot[k]+'</td></tr>').join('') + '<tr><td><b>Total heads</b></td><td class="r"><b>'+heads+'</b></td></tr></table>';
    } else h += '<p class="note" style="margin:0">Add heads to a zone to build your list.</p>';
    h += '<p class="note">Assumes standard (non-pressure-regulated) heads.</p></div>';

    app.innerHTML = h;
  }

  const num = v => { const x = parseFloat(v); return x > 0 ? x : null; };
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if(!b) return;
    const a = b.dataset.a, i = +b.dataset.i, z = S.zones[S.sel];
    if(a === 'psi-') S.psi = Math.max(10, S.psi - 5);
    else if(a === 'psi+') S.psi = Math.min(150, S.psi + 5);
    else if(a === 'line') S.line = b.dataset.k;
    else if(a === 'zone') S.sel = i;
    else if(a === 'addzone'){ S.zones.push({items:[]}); S.sel = S.zones.length-1; }
    else if(a === 'delzone'){ S.zones.splice(S.sel,1); S.sel = Math.max(0,S.sel-1); }
    else if(a === 'q-') S.qty = Math.max(1, S.qty-1);
    else if(a === 'q+') S.qty = Math.min(99, S.qty+1);
    else if(a === 'add'){ const ex = z.items.find(x => x.n === S.pick); if(ex) ex.q += S.qty; else z.items.push({n:S.pick,q:S.qty}); S.qty = 1; }
    else if(a === 'iq-'){ z.items[i].q--; if(z.items[i].q < 1) z.items.splice(i,1); }
    else if(a === 'iq+') z.items[i].q++;
    else if(a === 'del') z.items.splice(i,1);
    render();
  });
  app.addEventListener('change', e => {
    if(e.target.id === 'psi'){ const v = num(e.target.value); if(v) S.psi = Math.min(150, v); }
    else if(e.target.id === 'custom'){ const v = num(e.target.value); if(v) S.custom = v; }
    else if(e.target.id === 'pick') S.pick = e.target.value;
    render();
  });
  render();
})();
</script>
</body>
</html>
